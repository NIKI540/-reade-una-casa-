<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>solución de problemas</title>
</head>
<body>
    <h2>Solucion de problemas de la pasteleria</h2>
<script>
          // SUELDO DE LOS REPOSTEROS 
    
         let cantidadReposteros = parseInt(prompt("¿Cuantos reposteros trabajan en la reposteria?"));
         let sueldosReposteros = 0;
         for(let i = 0; i < cantidadReposteros; i++){
            let paga = parseFloat(prompt("Introduce el valor de paga de los reposteros" + (i + 1)));
            let sueldo = paga;
            sueldosReposteros += sueldo;
          }
         
          // MATERIA PRIMA 

         let cantidadMateriales = parseInt(prompt("¿Cuantos materiales se gastarón?"));
         let valorProductos = 0;
         for(let i = 0; i < cantidadMateriales; i++){
            let valor = parseFloat(prompt("Introcude el valor de los productos" + (i + 1)));
            let cantidad = valor;
            valorProductos += cantidad
          }

          // COSTO DE LA VITRINA 

          let opcionVitrina = parseInt(prompt("Elija la opción que mas le parezca:\n" + "1-vitrina economica\n" + "2-vitrina cara"));
          let precio = 0;
          if(opcionVitrina ==1){
            precio = 5000
            alert("Elejiste vitrina economica");
          } else if(opcionVitrina ==2){
            precio = 10000
            alert("Elejiste vitrina cara");
          }else{
            alert("opcion invalida");
          }

          // RESULTADO FINAL 

         let costoTotal = sueldosReposteros + valorProductos + opcionVitrina;
         alert("El salario del repostero es: " + costoTotal);
         console.log("la paga es:", costoTotal);
</script>   
</body>
</html>
