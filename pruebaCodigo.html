<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Área de la casa</title>
</head>

<body>

    <h1>Calculadora de áreas</h1>

    <script>
        // Área de triangulos
        
        let cantidadTriangulos = parseInt(prompt("¿Cuántos triángulos tiene la casa?"));
        let areaTriangulos = 0;
        for(let i = 1; i <= cantidadTriangulos; i++){
            let base = parseFloat(prompt("Introduce la base del triángulo " + i));
            let altura = parseFloat(prompt("Introduce la altura del triángulo " + i));
            let area = (base * altura) / 2;
            areaTriangulos += area;
        }
  
        // Área de cuadrados
        
        let cantidadCuadrados = parseInt(prompt("¿Cuántos cuadrados tiene la casa?"));
        let areaCuadrados = 0;
        for(let i = 1; i <= cantidadCuadrados; i++){
            let lado = parseFloat(prompt("Introduce el lado del cuadrado " + i));
            let area = lado * lado;
            areaCuadrados += area;
        }

        //Área de rectangulos
        let cantidadRectangulos = parseInt(prompt("¿Cuántos rectangulos tiene la casa?"));
        let areaRectangulos = 0;
        for(let i = 1; i <= cantidadRectangulos; i++){
            let base = parseFloat(prompt("Introduce la base del rectangulo" + 1));
            let altura = parseFloat(prompt("Introcuce la altura del rectangulo" + 1));
            let area = base * altura;
            areaRectangulos += area;
        }

        //Área de cilindros

         let cantidadCilindros = parseInt(prompt("¿Cuantos cilindros tiene la casa?"));
         let areaCilindros = 0;
         for(let i = 1; i <= cantidadCilindros; i++){
            let radio = parseFloat(prompt("Introduce el radio del cilindro" + i));
            let altura = parseFloat(prompt("Introduce la altura del cilindro" + i));
            let area = 2 * Math.PI * radio * (radio + altura);
            areaCilindros += area;
         }

        // RESULTADO FINAL

        let areaTotal = areaTriangulos + areaCuadrados + areaRectangulos + areaCilindros;
        alert("El área total es: " + areaTotal.toFixed(2));
        console.log("Área total:", areaTotal);
    </script>

</body>
</html>
